name: Native CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} (host=${{ matrix.host }}, plugin=${{ matrix.plugin }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            host: "ON"
            plugin: "ON"
          - os: windows-latest
            platform: windows
            host: "ON"
            plugin: "OFF"
          - os: macos-latest
            platform: macos
            host: "OFF"
            plugin: "ON"
    defaults:
      run:
        shell: bash
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Check out onnx-light 0.2.1
        uses: actions/checkout@v7
        with:
          repository: xadupre/onnx-light
          ref: "0.2.1"
          path: .deps/onnx-light
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Install standalone Python test dependencies
        if: matrix.host == 'ON'
        run: python -m pip install -r requirements/host-tests.txt
      - name: Configure against onnx-light 0.2.1
        run: |
          git -C .deps/onnx-light log -1 --format='%H %s'
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DFETCHCONTENT_SOURCE_DIR_ONNX_LIGHT="$GITHUB_WORKSPACE/.deps/onnx-light" \
            -DONNX_LIGHT_ORT_BUILD_HOST=${{ matrix.host }} \
            -DONNX_LIGHT_ORT_BUILD_PLUGIN=${{ matrix.plugin }} \
            -DONNX_LIGHT_ORT_TEST_PYTHON=${{ matrix.host }}
      - name: Build
        run: |
          cmake --build build --config Release \
            --parallel "$(python -c 'import os; print(os.cpu_count() or 1)')"
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Check no ORT runtime dependency
        if: runner.os == 'Linux'
        run: |
          ldd build/onnx_light_ort_dependency_test > build/runtime-dependencies.txt
          ldd build/onnx_light_ort/custom_ops/libonnx_light_ort_custom_ops.so \
            >> build/runtime-dependencies.txt
          ldd build/onnx_light_ort/bridge_ops_ort_called_by_light/libonnx_light_ort_bridge_ops_ort_called_by_light.so \
            >> build/runtime-dependencies.txt
          ldd build/onnx_light_ort/bridge_ops_ort_called_by_light/libonnx_light_ort_ort_custom_ops.so \
            >> build/runtime-dependencies.txt
          cat build/runtime-dependencies.txt
          if grep -i 'libonnxruntime' build/runtime-dependencies.txt; then
            echo "Unexpected ONNX Runtime dependency." >&2
            exit 1
          fi
  sanitizers:
    name: AddressSanitizer and UndefinedBehaviorSanitizer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Check out onnx-light 0.2.1
        uses: actions/checkout@v7
        with:
          repository: xadupre/onnx-light
          ref: "0.2.1"
          path: .deps/onnx-light
          persist-credentials: false
      - name: Configure with AddressSanitizer and UndefinedBehaviorSanitizer
        run: |
          git -C .deps/onnx-light log -1 --format='%H %s'
          cmake -S . -B build-sanitizers \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DFETCHCONTENT_SOURCE_DIR_ONNX_LIGHT="$GITHUB_WORKSPACE/.deps/onnx-light"
      - name: Build
        run: cmake --build build-sanitizers --parallel "$(nproc)"
      - name: Test
        run: |
          UBSAN_OPTIONS=halt_on_error=1 \
            ctest --test-dir build-sanitizers --output-on-failure

  ort-integration:
    name: Bidirectional custom ops (latest ORT)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Check out onnx-light 0.2.1
        uses: actions/checkout@v7
        with:
          repository: xadupre/onnx-light
          ref: "0.2.1"
          path: .deps/onnx-light
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/ort-tests.txt
            requirements/host-tests.txt
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Resolve latest stable ONNX Runtime release
        id: ort
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release=$(gh api repos/microsoft/onnxruntime/releases/latest)
          version=$(jq -r '.tag_name | ltrimstr("v")' <<< "$release")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          checksum=$(jq -r --arg name "onnxruntime-linux-x64-$version.tgz" \
            '.assets[] | select(.name == $name) | .digest | ltrimstr("sha256:")' \
            <<< "$release")
          [[ "$checksum" =~ ^[a-f0-9]{64}$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
      - name: Install real-host test dependencies
        env:
          ORT_VERSION: ${{ steps.ort.outputs.version }}
        run: |
          python -m pip install -r requirements/ort-tests.txt \
            "onnxruntime==$ORT_VERSION"
      - name: Fetch the matching standalone runtime for the C++ example
        env:
          ORT_VERSION: ${{ steps.ort.outputs.version }}
          ORT_CHECKSUM: ${{ steps.ort.outputs.checksum }}
        run: |
          archive="$RUNNER_TEMP/onnxruntime-linux-x64-$ORT_VERSION.tgz"
          curl --fail --location --silent --show-error \
            "https://github.com/microsoft/onnxruntime/releases/download/v$ORT_VERSION/onnxruntime-linux-x64-$ORT_VERSION.tgz" \
            --output "$archive"
          echo "$ORT_CHECKSUM  $archive" \
            | sha256sum --check
          mkdir -p .deps/ort-runtime
          tar -xzf "$archive" -C .deps/ort-runtime --strip-components=1
      - name: Build inplace and run C++ tests
        env:
          CMAKE_ARGS: >-
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
            -DFETCHCONTENT_SOURCE_DIR_ONNX_LIGHT=${{ github.workspace }}/.deps/onnx-light
            -DONNX_LIGHT_ORT_TEST_PYTHON=ON
            -DONNX_LIGHT_ORT_TEST_WITH_ORT=ON
            -DONNX_LIGHT_ORT_RUNTIME_LIBRARY=${{ github.workspace }}/.deps/ort-runtime/lib/libonnxruntime.so
        run: python setup.py build_ext --inplace --cpp-tests
      - name: Run bidirectional Python and gallery tests
        run: |
          ctest --test-dir build --output-on-failure
      - name: Reuse the same local onnx-light runtime
        env:
          PYTHONPATH: ${{ github.workspace }}/build/python
          ONNX_LIGHT_ORT_ONNX_LIGHT_SOURCE_DIR: ${{ github.workspace }}/.deps/onnx-light
          CMAKE_ARGS: >-
            -DONNX_LIGHT_ORT_TEST_PYTHON=ON
            -DONNX_LIGHT_ORT_TEST_WITH_ORT=ON
        run: |
          python setup.py build_ext --inplace --cpp-tests --onnx-light-source
          ctest --test-dir build --output-on-failure
