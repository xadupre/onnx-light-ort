name: Fuzz

on:
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - ".github/workflows/fuzz.yml"
  push:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: fuzz smoke (ubuntu-latest, clang+libFuzzer)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Check out onnx-light 0.2.1
        uses: actions/checkout@v7
        with:
          repository: xadupre/onnx-light
          ref: "0.2.1"
          path: .deps/onnx-light
          persist-credentials: false
      - name: Install Clang and Ninja
        run: sudo apt-get install -y clang ninja-build
      - name: Configure fuzz build
        env:
          CC: clang
          CXX: clang++
        run: |
          git -C .deps/onnx-light log -1 --format='%H %s'
          cmake -S . -B build-fuzz -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DFETCHCONTENT_SOURCE_DIR_ONNX_LIGHT="$GITHUB_WORKSPACE/.deps/onnx-light" \
            -DONNX_LIGHT_ORT_BUILD_FUZZERS=ON \
            -DONNX_LIGHT_ORT_BUILD_TESTS=OFF
      - name: Build fuzz harnesses
        run: |
          cmake --build build-fuzz --parallel "$(nproc)" --target \
            fuzz_checker \
            fuzz_model_loader \
            fuzz_parser \
            fuzz_shape_inference \
            fuzz_optim_shape_inference \
            fuzz_version_converter \
            fuzz_compose \
            fuzz_ort_flatbuffers \
            make_seed_corpus
      - name: Generate seed corpora
        run: |
          mkdir -p /tmp/fuzz_seeds
          ./build-fuzz/_deps/onnx_light-build/make_seed_corpus \
            /tmp/fuzz_seeds/version_converter \
            /tmp/fuzz_seeds/parser \
            /tmp/fuzz_seeds/shape_inference
      - name: Run fuzz smoke campaigns
        run: |
          ./build-fuzz/_deps/onnx_light-build/fuzz_checker -runs=2000 -timeout=25
          ./build-fuzz/_deps/onnx_light-build/fuzz_model_loader -runs=2000 -timeout=25
          ./build-fuzz/_deps/onnx_light-build/fuzz_parser /tmp/fuzz_seeds/parser -runs=2000 -timeout=25
          ./build-fuzz/_deps/onnx_light-build/fuzz_shape_inference /tmp/fuzz_seeds/shape_inference -runs=2000 -timeout=25
          ./build-fuzz/_deps/onnx_light-build/fuzz_optim_shape_inference /tmp/fuzz_seeds/shape_inference -runs=2000 -timeout=25
          ./build-fuzz/_deps/onnx_light-build/fuzz_version_converter /tmp/fuzz_seeds/version_converter -runs=2000 -timeout=25
          ./build-fuzz/_deps/onnx_light-build/fuzz_compose -runs=2000 -timeout=25
          ./build-fuzz/_deps/onnx_light-build/fuzz_ort_flatbuffers -runs=2000 -timeout=25
