name: Documentation

on:
  push:
    branches: [main]
    paths: ["docs/**", "README.rst", ".github/workflows/docs.yml", "onnx_light_ort/**", "examples/**", "cmake/**", "CMakeLists.txt", "requirements/**"]
  pull_request:
    branches: [main]
    paths: ["docs/**", "README.rst", ".github/workflows/docs.yml", "onnx_light_ort/**", "examples/**", "cmake/**", "CMakeLists.txt", "requirements/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Check out onnx-light main
        uses: actions/checkout@v7
        with:
          repository: xadupre/onnx-light
          ref: main
          path: .deps/onnx-light
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            docs/requirements.txt
            requirements/ort-tests.txt
      - run: python -m pip install -r docs/requirements.txt
      - name: Build native libraries for the gallery
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DFETCHCONTENT_SOURCE_DIR_ONNX_LIGHT="$GITHUB_WORKSPACE/.deps/onnx-light" \
            -DONNX_LIGHT_ORT_BUILD_TESTS=OFF
          cmake --build build --parallel "$(nproc)"
      - name: Build documentation and execute both gallery examples
        env:
          ONNX_LIGHT_ORT_PLUGIN_LIBRARY: ${{ github.workspace }}/build/onnx_light_ort/custom_ops/libonnx_light_ort_custom_ops.so
          ONNX_LIGHT_ORT_HOST_LIBRARY: ${{ github.workspace }}/build/onnx_light_ort/bridge_ops_ort_to_light/libonnx_light_ort_bridge_ops_ort_to_light.so
          ONNX_LIGHT_ORT_FIXTURE_LIBRARY: ${{ github.workspace }}/build/onnx_light_ort/bridge_ops_ort_to_light/libonnx_light_ort_scale_fixture.so
        run: python -m sphinx -b html -W --keep-going docs build/docs
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/docs

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
