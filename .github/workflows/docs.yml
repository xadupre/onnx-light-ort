name: Documentation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Check out onnx-light 0.2.2
        uses: actions/checkout@v7
        with:
          repository: xadupre/onnx-light
          ref: "0.2.2"
          path: .deps/onnx-light
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            docs/requirements.txt
            requirements/ort-tests.txt
            requirements/host-tests.txt
      - run: python -m pip install -r docs/requirements.txt
      - name: Configure the gallery dependency checkout
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DFETCHCONTENT_SOURCE_DIR_ONNX_LIGHT="$GITHUB_WORKSPACE/.deps/onnx-light" \
            -DONNX_LIGHT_ORT_BUILD_TESTS=OFF \
            -DONNX_LIGHT_ORT_BUILD_PYTHON=ON
      - name: Build documentation and execute both gallery examples
        run: python -m sphinx -b html -W --keep-going docs build/docs
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/docs

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  report-failure:
    if: >-
      always() && github.event_name == 'schedule' &&
      (needs.build.result == 'failure' || needs.deploy.result == 'failure')
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open an issue for the failed weekly documentation run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --title "Weekly documentation workflow failed" \
            --body "The weekly documentation workflow failed. See the logs: $RUN_URL"
